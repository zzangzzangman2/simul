  <style>
    :root {
      --app-height: 100dvh;
      --desktop-preview-scale: 1;
    }

    html,
    body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--app-height);
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #061F2A;
    }

    body {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    #flutter_host {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--app-height);
      overflow: hidden;
      background: #061F2A;
    }

    flutter-view {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }

    @media (hover: hover) and (pointer: fine) and (min-width: 700px) {
      html,
      body {
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 50% 15%, #193b49 0, #07151d 42%, #02080c 100%);
      }

      #flutter_host {
        top: 50%;
        left: 50%;
        width: 390px;
        height: 844px;
        border: 10px solid #0b1115;
        border-radius: 34px;
        box-sizing: content-box;
        transform: translate(-50%, -50%) scale(var(--desktop-preview-scale));
        transform-origin: center;
        box-shadow:
          0 26px 80px rgba(0, 0, 0, 0.58),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    #install-banner {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 40;
      width: min(360px, calc(100vw - 24px));
      transform: translateX(-50%);
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(9, 30, 40, 0.94);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      color: #eaf3f7;
      font-family: 'Maplestory', 'Pretendard', system-ui, sans-serif;
    }

    #install-banner[hidden] {
      display: none;
    }

    #install-banner p {
      margin: 0 0 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    #install-banner-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    #install-banner button {
      appearance: none;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    #install-banner-accept {
      border-color: transparent;
      background: #ffb84d;
      color: #10222b;
      font-weight: 700;
    }

    #install-banner-accept[hidden] {
      display: none;
    }

    #install-banner-dismiss {
      background: transparent;
      color: rgba(234, 243, 247, 0.72);
    }

<body>
  <div id="flutter_host"></div>
  <script id="mobile-viewport-lock">
    (() => {
      const root = document.documentElement;
      const host = document.getElementById('flutter_host');
      const viewport = window.visualViewport;
      const keyboardThreshold = 120;
      const desktopPreviewHeight = 844;
      const desktopPreviewOuterWidth = 410;
      const desktopPreviewOuterHeight = 864;
      const desktopPreviewQuery = window.matchMedia?.(
        '(hover: hover) and (pointer: fine) and (min-width: 700px)',
      );
      const isDesktopPreview = () => desktopPreviewQuery?.matches === true;
      const visibleViewportHeight = () => {
        const visualHeight = viewport?.height;
        if (Number.isFinite(visualHeight) && visualHeight > 0) {
          return visualHeight;
        }
        return window.innerHeight || root.clientHeight;
      };

      const isEditingText = () => {
        const active = document.activeElement;
        const tagName = active?.tagName?.toLowerCase();
        return (
          tagName === 'input' ||
          tagName === 'textarea' ||
          active?.isContentEditable === true
        );
      };

      let layoutHeight = visibleViewportHeight();

      const applyLayout = () => {
        if (isDesktopPreview()) {
          const availableWidth = Math.max(1, window.innerWidth - 32);
          const availableHeight = Math.max(1, window.innerHeight - 32);
          const scale = Math.min(
            1,
            availableWidth / desktopPreviewOuterWidth,
            availableHeight / desktopPreviewOuterHeight,
          );
          root.style.setProperty(
            '--desktop-preview-scale',
            scale.toFixed(4),
          );
          root.style.setProperty(
            '--app-height',
            `${desktopPreviewHeight}px`,
          );
          host.style.height = `${desktopPreviewHeight}px`;
        } else {
          root.style.setProperty('--desktop-preview-scale', '1');
          root.style.setProperty('--app-height', `${Math.round(layoutHeight)}px`);
          host.style.height = `${Math.round(layoutHeight)}px`;
        }
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      };

      const refreshLayout = () => {
        if (isDesktopPreview()) {
          layoutHeight = desktopPreviewHeight;
          window.requestAnimationFrame(applyLayout);
          return;
        }
        const visibleHeight = visibleViewportHeight();
        const keyboardVisible =
          isEditingText() && layoutHeight - visibleHeight > keyboardThreshold;
        if (!keyboardVisible) {
          layoutHeight = visibleHeight;
        }
        window.requestAnimationFrame(applyLayout);
      };

      window.addEventListener('resize', refreshLayout, { passive: true });
      desktopPreviewQuery?.addEventListener?.('change', refreshLayout);
      viewport?.addEventListener('resize', refreshLayout, { passive: true });
      viewport?.addEventListener('scroll', () => {
        window.requestAnimationFrame(applyLayout);
      }, { passive: true });
      window.addEventListener('orientationchange', () => {
        window.setTimeout(() => {
          layoutHeight = visibleViewportHeight();
          applyLayout();
        }, 250);
      });

      applyLayout();
    })();
  </script>
  <script id="legacy-save-bridge">
    (() => {
      const legacyKey = 'simul-millennium-capital-v1';
      const flutterKey = `flutter.${legacyKey}`;
      const bridgeMarkerKey = `${legacyKey}-flutter-bridge-v1`;

      try {
        if (localStorage.getItem(bridgeMarkerKey) !== null) return;
        if (localStorage.getItem(flutterKey) !== null) {
          localStorage.setItem(bridgeMarkerKey, '1');
          return;
        }
        const legacySave = localStorage.getItem(legacyKey);
        if (legacySave !== null) {
          const parsed = JSON.parse(legacySave);
          if (
            !parsed ||
            Array.isArray(parsed) ||
            typeof parsed !== 'object' ||
            typeof parsed.companyName !== 'string' ||
            parsed.companyName.trim() === ''
          ) return;
          // shared_preferences_web JSON-encodes string values in localStorage.
          localStorage.setItem(flutterKey, JSON.stringify(legacySave));
          localStorage.setItem(bridgeMarkerKey, '1');
        }
      } catch (_) {
        // Storage can be unavailable in private or restricted browser contexts.
      }
    })();
  </script>
  <div id="install-banner" hidden>
    <p id="install-banner-text"></p>
    <div id="install-banner-actions">
      <button id="install-banner-accept" type="button">설치</button>
      <button id="install-banner-dismiss" type="button">나중에</button>
    </div>
  </div>
  <script id="install-prompt">
    (() => {
      // 홈 화면에 설치해야 주소창이 사라진다. 설치 가능한 상태를 유저가 알 방법이
      // 없어서 게임이 브라우저처럼 보였다. 설치 뒤에는 이 배너를 다시 띄우지 않는다.
      const dismissKey = 'decimal-install-banner-dismissed-v3';
      const dismissForMs = 24 * 60 * 60 * 1000;
      const banner = document.getElementById('install-banner');
      const text = document.getElementById('install-banner-text');
      const accept = document.getElementById('install-banner-accept');
      const dismiss = document.getElementById('install-banner-dismiss');
      if (!banner || !text || !accept || !dismiss) return;

      const installed = () =>
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      const suppressed = () => {
        try {
          const dismissedAt = Number(window.localStorage.getItem(dismissKey));
          return Number.isFinite(dismissedAt) && Date.now() - dismissedAt < dismissForMs;
        } catch (_) {
          return false;
        }
      };

      const hide = () => {
        banner.hidden = true;
      };

      const show = (message, canInstall) => {
        if (installed() || suppressed()) return;
        text.textContent = message;
        accept.textContent = canInstall ? '설치' : '설치 방법';
        accept.hidden = false;
        banner.hidden = false;
      };

      dismiss.addEventListener('click', () => {
        try {
          window.localStorage.setItem(dismissKey, String(Date.now()));
        } catch (_) {
          // Storage can be unavailable in private or restricted browser contexts.
        }
        hide();
      });

      let deferred = null;
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferred = event;
        show('홈 화면에 설치하면 주소창 없이 전체화면으로 플레이할 수 있어요.', true);
      });

      accept.addEventListener('click', async () => {
        if (!deferred) {
          text.textContent = isIosSafari
            ? 'Safari 아래의 공유 버튼을 누른 뒤 “홈 화면에 추가”를 선택해 주세요.'
            : window.isSecureContext
            ? '브라우저 메뉴에서 “앱 설치” 또는 “홈 화면에 추가”를 선택해 주세요.'
            : '현재 HTTP 주소는 설치 버튼을 지원하지 않습니다. HTTPS 배포 주소에서 다시 열어 주세요.';
          return;
        }
        hide();
        deferred.prompt();
        try {
          await deferred.userChoice;
        } catch (_) {
          // The user can dismiss the native sheet without a choice.
        }
        deferred = null;
      });

      window.addEventListener('appinstalled', () => {
        deferred = null;
        hide();
      });

      // iOS 사파리와 설치 이벤트가 없는 모바일 브라우저에도 수동 경로를 안내한다.
      const isIosSafari =
        /iPad|iPhone|iPod/.test(window.navigator.userAgent) &&
        !/CriOS|FxiOS|EdgiOS/.test(window.navigator.userAgent);
      const isMobileBrowser =
        /Android|iPad|iPhone|iPod|Mobile/i.test(window.navigator.userAgent) ||
        window.matchMedia('(pointer: coarse)').matches;
      if (isMobileBrowser) {
        window.setTimeout(() => {
          if (deferred) return;
          if (!window.isSecureContext) {
            show('현재 테스트 주소는 HTTP라 자동 설치가 차단됩니다. 설치 방법을 확인해 주세요.', false);
            return;
          }
          if (isIosSafari) {
            show('공유 버튼을 눌러 “홈 화면에 추가”하면 주소창 없이 전체화면으로 플레이할 수 있어요.', false);
            return;
          }
          show('브라우저 메뉴에서 “앱 설치” 또는 “홈 화면에 추가”를 선택하면 앱 화면으로 플레이할 수 있어요.', false);
        }, 700);
      }
    })();
  </script>
  <script id="pwa-worker-registration">
    (() => {
      window.decimalPwaWorkerReady = Promise.resolve();
      if (!('serviceWorker' in window.navigator) || !window.isSecureContext) return;

      const currentBuildId = document
        .querySelector('meta[name="decimal-build-id"]')
        ?.getAttribute('content');
      const expectedBuildId = /^[0-9a-f]{12}$/.test(currentBuildId ?? '')
        ? currentBuildId
        : null;
      const controllerUsesCurrentBuild = () => {
        const scriptUrl = window.navigator.serviceWorker.controller?.scriptURL;
        if (!scriptUrl || !expectedBuildId) return false;
        return new URL(scriptUrl).searchParams.get('v') === expectedBuildId;
      };
      const waitForCurrentController = (registration) => new Promise((resolve) => {
        if (!expectedBuildId) {
          resolve();
          return;
        }
        if (controllerUsesCurrentBuild()) {
          resolve();
          return;
        }

        const finishIfCurrent = () => {
          if (!controllerUsesCurrentBuild()) return;
          window.navigator.serviceWorker.removeEventListener('controllerchange', finishIfCurrent);
          resolve();
        };
        window.navigator.serviceWorker.addEventListener('controllerchange', finishIfCurrent);

        const targetWorker = [
          registration.installing,
          registration.waiting,
          registration.active,
        ].find((worker) => {
          if (!worker || !expectedBuildId) return false;
          return new URL(worker.scriptURL).searchParams.get('v') === expectedBuildId;
        });
        targetWorker?.addEventListener('statechange', finishIfCurrent);
      });
      const timeout = new Promise((resolve) => window.setTimeout(resolve, 4000));

      const activateCurrentWorker = window.navigator.serviceWorker
        .register('pwa_service_worker.js?v=e1661bbb880f', {
          scope: './',
          updateViaCache: 'none',
        })
        .then((registration) => waitForCurrentController(registration))
        .catch(() => {
          // 설치 지원이 없는 브라우저에서도 게임 실행은 계속한다.
        });
      window.decimalPwaWorkerReady = Promise.race([activateCurrentWorker, timeout]);
    })();
  </script>
  <script id="automatic-app-update">
    (() => {
      // 설치된 앱도 다시 열거나 백그라운드에서 돌아올 때 최신 빌드로 이동한다.
      // 게임 중간에 갑자기 새로고침하지 않도록 활성 플레이 중에는 폴링하지 않는다.
      const currentBuildId = document
        .querySelector('meta[name="decimal-build-id"]')
        ?.getAttribute('content');
      if (!currentBuildId || !/^[0-9a-f]{12}$/.test(currentBuildId)) return;

      // Keep the controlling worker and this document on the same asset generation.
      // This also protects the first reload while an older worker is being replaced.
      const currentUrl = new URL(window.location.href);
      if (currentUrl.searchParams.get('appBuild') !== currentBuildId) {
        currentUrl.searchParams.set('appBuild', currentBuildId);
        window.history.replaceState(window.history.state, '', currentUrl);
      }

      let checking = false;
      const checkForUpdate = async () => {
        if (checking || !window.navigator.onLine) return;
        checking = true;
        try {
          const response = await fetch(`version.json?check=${Date.now()}`, {
            cache: 'no-store',
            credentials: 'same-origin',
          });
          if (!response.ok) return;
          const latest = await response.json();
          const latestBuildId = latest?.build_id;
          if (
            typeof latestBuildId !== 'string' ||
            latestBuildId === currentBuildId ||
            !/^[0-9a-f]{12}$/.test(latestBuildId)
          ) return;

          const nextUrl = new URL(window.location.href);
          if (nextUrl.searchParams.get('appBuild') === latestBuildId) return;
          nextUrl.searchParams.set('appBuild', latestBuildId);
          window.location.replace(nextUrl.toString());
        } catch (_) {
          // 오프라인이거나 배포 교체 중이면 다음 실행·복귀 때 다시 확인한다.
        } finally {
          checking = false;
        }
      };

      window.setTimeout(checkForUpdate, 1200);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkForUpdate();
      });
      window.addEventListener('pageshow', checkForUpdate);
      window.addEventListener('online', checkForUpdate);
    })();
  </script>
  <script id="flutter-bootstrap-loader">
    (() => {
      const loadFlutter = () => {
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=e1661bbb880f';
        script.async = true;
        document.body.appendChild(script);
      };
      Promise.resolve(window.decimalPwaWorkerReady).then(loadFlutter, loadFlutter);
    })();
  </script>
