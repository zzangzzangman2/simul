name: millennium_capital
description: "Project Decimal, a financial survival and life simulation set in Seoul in 2000."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/dialogue/
    - assets/images/
    - assets/images/production_soft_painted/kim_seoa/
    - assets/images/production_soft_painted/lee_jian/
    - assets/images/production_soft_painted/choi_iseo/
    - assets/images/production_soft_painted/park_haeun/
    - assets/images/production_soft_painted/jung_arin/
    - assets/images/production_soft_painted/han_sua/
    - assets/images/production_soft_painted/oh_jiwoo/
    - assets/images/production_soft_painted/yoon_chaea/
    - assets/images/production_soft_painted/kim_hakjun/
    - assets/images/cinematic_soft_painted/decimal/
    - assets/images/cinematic_soft_painted/decimal_weekend/
    - assets/images/cinematic_soft_painted/decimal_nis_1999/backgrounds/
    - assets/images/cinematic_soft_painted/decimal_nis_1999/characters/
    - assets/images/minigames/
    - assets/images/horse_racing/
    - assets/images/gameplay_map/
    - assets/images/gameplay_ambient/
    - assets/images/real_estate/
    - assets/images/kbeauty_gifts/
    - assets/images/casino/
    - assets/images/주식선생님/22_포즈1_주인공그림체_공통슬롯_투명.png
    - assets/images/주식선생님/23_포즈2_주인공그림체_공통슬롯_투명.png
    - assets/images/주식선생님/24_포즈3_주인공그림체_공통슬롯_투명.png
    - assets/images/주식선생님/25_포즈4_주인공그림체_공통슬롯_투명.png
    - assets/images/주식선생님/26_포즈5_주인공그림체_공통슬롯_투명.png
    - assets/images/주식선생님/27_포즈6_주인공그림체_공통슬롯_투명.png
    - assets/fonts/LICENSE-Pretendard.txt
    - assets/fonts/LICENSE-Maplestory.txt
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    - family: Maplestory
      fonts:
        - asset: assets/fonts/MaplestoryLight.ttf
          weight: 400
        - asset: assets/fonts/MaplestoryBold.ttf
          weight: 700
