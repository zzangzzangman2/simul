  <div id="flutter_host"></div>
  <script id="mobile-viewport-lock">
    (() => {
      const root = document.documentElement;
      const host = document.getElementById('flutter_host');
      const viewport = window.visualViewport;
      const keyboardThreshold = 120;
      const desktopPreviewHeight = 844;
      const desktopPreviewOuterWidth = 410;
      const desktopPreviewOuterHeight = 864;
      const desktopPreviewQuery = window.matchMedia?.(
        '(hover: hover)',
      );
      const isDesktopPreview = () => desktopPreviewQuery?.matches === true;
      const visibleViewportHeight = () => {
        const visualHeight = viewport?.height;
        if (Number.isFinite(visualHeight) && visualHeight > 0) {
          return visualHeight;
        }
        return window.innerHeight || root.clientHeight;
      };

      const isEditingText = () => {
        const active = document.activeElement;
        const tagName = active?.tagName?.toLowerCase();
        return (
          tagName === 'input' ||
          tagName === 'textarea' ||
          active?.isContentEditable === true
        );
      };

      let layoutHeight = visibleViewportHeight();

      const applyLayout = () => {
        if (isDesktopPreview()) {
          const availableWidth = Math.max(1, window.innerWidth - 32);
          const availableHeight = Math.max(1, window.innerHeight - 32);
          const scale = Math.min(
            1,
            availableWidth / desktopPreviewOuterWidth,
            availableHeight / desktopPreviewOuterHeight,
          );
          root.style.setProperty(
            '--desktop-preview-scale',
            scale.toFixed(4),
          );
          root.style.setProperty(
            '--app-height',
            `${desktopPreviewHeight}px`,
          );
          host.style.height = `${desktopPreviewHeight}px`;
        } else {
          root.style.setProperty('--desktop-preview-scale', '1');
          root.style.setProperty('--app-height', `${Math.round(layoutHeight)}px`);
          host.style.height = `${Math.round(layoutHeight)}px`;
        }
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      };

      const refreshLayout = () => {
        if (isDesktopPreview()) {
          layoutHeight = desktopPreviewHeight;
          window.requestAnimationFrame(applyLayout);
          return;
        }
        const visibleHeight = visibleViewportHeight();
        const keyboardVisible =
          isEditingText() && layoutHeight - visibleHeight > keyboardThreshold;
        if (!keyboardVisible) {
          layoutHeight = visibleHeight;
        }
        window.requestAnimationFrame(applyLayout);
      };

      window.addEventListener('resize', refreshLayout, { passive: true });
      desktopPreviewQuery?.addEventListener?.('change', refreshLayout);
      viewport?.addEventListener('resize', refreshLayout, { passive: true });
      viewport?.addEventListener('scroll', () => {
        window.requestAnimationFrame(applyLayout);
      }, { passive: true });
      window.addEventListener('orientationchange', () => {
        window.setTimeout(() => {
          layoutHeight = visibleViewportHeight();
          applyLayout();
        }, 250);
      });

      applyLayout();
    })();
  </script>
  <script id="legacy-save-bridge">
    (() => {
      const legacyKey = 'simul-millennium-capital-v1';
      const flutterKey = `flutter.${legacyKey}`;
      const bridgeMarkerKey = `${legacyKey}-flutter-bridge-v1`;

      try {
        if (localStorage.getItem(bridgeMarkerKey) !== null) return;
        if (localStorage.getItem(flutterKey) !== null) {
          localStorage.setItem(bridgeMarkerKey, '1');
          return;
        }
        const legacySave = localStorage.getItem(legacyKey);
        if (legacySave !== null) {
          const parsed = JSON.parse(legacySave);
          if (
            !parsed ||
            Array.isArray(parsed) ||
            typeof parsed !== 'object' ||
            typeof parsed.companyName !== 'string' ||
            parsed.companyName.trim() === ''
          ) return;
          // shared_preferences_web JSON-encodes string values in localStorage.
          localStorage.setItem(flutterKey, JSON.stringify(legacySave));
          localStorage.setItem(bridgeMarkerKey, '1');
        }
      } catch (_) {
        // Storage can be unavailable in private or restricted browser contexts.
      }
    })();
  </script>
