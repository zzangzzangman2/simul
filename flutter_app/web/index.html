  <style>
    :root {
      --app-height: 100dvh;
      --desktop-preview-scale: 1;
    }

    html,
    body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--app-height);
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #061F2A;
    }

    body {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    #flutter_host {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--app-height);
      overflow: hidden;
      background: #061F2A;
    }

    flutter-view {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }

    @media (hover: hover) and (pointer: fine) and (min-width: 700px) {
      html,
      body {
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 50% 15%, #193b49 0, #07151d 42%, #02080c 100%);
      }

      #flutter_host {
        top: 50%;
        left: 50%;
        width: 390px;
        height: 844px;
        border: 10px solid #0b1115;
        border-radius: 34px;
        box-sizing: content-box;
        transform: translate(-50%, -50%) scale(var(--desktop-preview-scale));
        transform-origin: center;
        box-shadow:
          0 26px 80px rgba(0, 0, 0, 0.58),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    #install-banner {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 40;
      width: min(360px, calc(100vw - 24px));
      transform: translateX(-50%);
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(9, 30, 40, 0.94);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      color: #eaf3f7;
      font-family: 'Maplestory', 'Pretendard', system-ui, sans-serif;
    }

    #install-banner[hidden] {
      display: none;
    }

    #install-banner p {
      margin: 0 0 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    #install-banner-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    #install-banner button {
      appearance: none;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    #install-banner-accept {
      border-color: transparent;
      background: #ffb84d;
      color: #10222b;
      font-weight: 700;
    }

    #install-banner-accept[hidden] {
      display: none;
    }

    #install-banner-dismiss {
      background: transparent;
      color: rgba(234, 243, 247, 0.72);
    }
  </style>

<body>
  <div id="flutter_host"></div>
  <script id="mobile-viewport-lock">
    (() => {
      const root = document.documentElement;
      const host = document.getElementById('flutter_host');
      const viewport = window.visualViewport;
      const keyboardThreshold = 120;
      const desktopPreviewHeight = 844;
      const desktopPreviewOuterWidth = 410;
      const desktopPreviewOuterHeight = 864;
      const desktopPreviewQuery = window.matchMedia?.(
        '(hover: hover) and (pointer: fine) and (min-width: 700px)',
      );
      const isDesktopPreview = () => desktopPreviewQuery?.matches === true;
      const visibleViewportHeight = () => {
        const visualHeight = viewport?.height;
        if (Number.isFinite(visualHeight) && visualHeight > 0) {
          return visualHeight;
        }
        return window.innerHeight || root.clientHeight;
      };

      const isEditingText = () => {
        const active = document.activeElement;
        const tagName = active?.tagName?.toLowerCase();
        return (
          tagName === 'input' ||
          tagName === 'textarea' ||
          active?.isContentEditable === true
        );
      };

      let layoutHeight = visibleViewportHeight();

      const applyLayout = () => {
        if (isDesktopPreview()) {
          const availableWidth = Math.max(1, window.innerWidth - 32);
          const availableHeight = Math.max(1, window.innerHeight - 32);
          const scale = Math.min(
            1,
            availableWidth / desktopPreviewOuterWidth,
            availableHeight / desktopPreviewOuterHeight,
          );
          root.style.setProperty(
            '--desktop-preview-scale',
            scale.toFixed(4),
          );
          root.style.setProperty(
            '--app-height',
            `${desktopPreviewHeight}px`,
          );
          host.style.height = `${desktopPreviewHeight}px`;
        } else {
          root.style.setProperty('--desktop-preview-scale', '1');
          root.style.setProperty('--app-height', `${Math.round(layoutHeight)}px`);
          host.style.height = `${Math.round(layoutHeight)}px`;
        }
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      };

      const refreshLayout = () => {
        if (isDesktopPreview()) {
          layoutHeight = desktopPreviewHeight;
          window.requestAnimationFrame(applyLayout);
          return;
        }
        const visibleHeight = visibleViewportHeight();
        const keyboardVisible =
          isEditingText() && layoutHeight - visibleHeight > keyboardThreshold;
        if (!keyboardVisible) {
          layoutHeight = visibleHeight;
        }
        window.requestAnimationFrame(applyLayout);
      };

      window.addEventListener('resize', refreshLayout, { passive: true });
      desktopPreviewQuery?.addEventListener?.('change', refreshLayout);
      viewport?.addEventListener('resize', refreshLayout, { passive: true });
      viewport?.addEventListener('scroll', () => {
        window.requestAnimationFrame(applyLayout);
      }, { passive: true });
      window.addEventListener('orientationchange', () => {
        window.setTimeout(() => {
          layoutHeight = visibleViewportHeight();
          applyLayout();
        }, 250);
      });

      applyLayout();
    })();
  </script>
  <script id="legacy-save-bridge">
    (() => {
      const legacyKey = 'simul-millennium-capital-v1';
      const flutterKey = `flutter.${legacyKey}`;
      const bridgeMarkerKey = `${legacyKey}-flutter-bridge-v1`;

      try {
        if (localStorage.getItem(bridgeMarkerKey) !== null) return;
        if (localStorage.getItem(flutterKey) !== null) {
          localStorage.setItem(bridgeMarkerKey, '1');
          return;
        }
        const legacySave = localStorage.getItem(legacyKey);
        if (legacySave !== null) {
          const parsed = JSON.parse(legacySave);
          if (
            !parsed ||
            Array.isArray(parsed) ||
            typeof parsed !== 'object' ||
            typeof parsed.companyName !== 'string' ||
            parsed.companyName.trim() === ''
          ) return;
          // shared_preferences_web JSON-encodes string values in localStorage.
          localStorage.setItem(flutterKey, JSON.stringify(legacySave));
          localStorage.setItem(bridgeMarkerKey, '1');
        }
      } catch (_) {
        // Storage can be unavailable in private or restricted browser contexts.
      }
    })();
  </script>
  <div id="install-banner" hidden>
    <p id="install-banner-text"></p>
    <div id="install-banner-actions">
      <button id="install-banner-accept" type="button">설치</button>
      <button id="install-banner-dismiss" type="button">나중에</button>
    </div>
  </div>
  <script id="install-prompt">
    (() => {
      // 홈 화면에 설치해야 주소창이 사라진다. 설치 가능한 상태를 유저가 알 방법이
      // 없어서 게임이 브라우저처럼 보였다. 설치 뒤에는 이 배너를 다시 띄우지 않는다.
      const dismissKey = 'decimal-install-banner-dismissed-v1';
      const banner = document.getElementById('install-banner');
      const text = document.getElementById('install-banner-text');
      const accept = document.getElementById('install-banner-accept');
      const dismiss = document.getElementById('install-banner-dismiss');
      if (!banner || !text || !accept || !dismiss) return;

      const installed = () =>
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      const suppressed = () => {
        try {
          return window.localStorage.getItem(dismissKey) === '1';
        } catch (_) {
          return false;
        }
      };

      const hide = () => {
        banner.hidden = true;
      };

      const show = (message, canInstall) => {
        if (installed() || suppressed()) return;
        text.textContent = message;
        accept.hidden = !canInstall;
        banner.hidden = false;
      };

      dismiss.addEventListener('click', () => {
        try {
          window.localStorage.setItem(dismissKey, '1');
        } catch (_) {
          // Storage can be unavailable in private or restricted browser contexts.
        }
        hide();
      });

      let deferred = null;
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferred = event;
        show('홈 화면에 설치하면 주소창 없이 전체화면으로 플레이할 수 있어요.', true);
      });

      accept.addEventListener('click', async () => {
        if (!deferred) return hide();
        hide();
        deferred.prompt();
        try {
          await deferred.userChoice;
        } catch (_) {
          // The user can dismiss the native sheet without a choice.
        }
        deferred = null;
      });

      window.addEventListener('appinstalled', () => {
        deferred = null;
        hide();
      });

      // iOS 사파리는 beforeinstallprompt를 쏘지 않으므로 공유 버튼 경로를 직접 안내한다.
      const isIosSafari =
        /iPad|iPhone|iPod/.test(window.navigator.userAgent) &&
        !/CriOS|FxiOS|EdgiOS/.test(window.navigator.userAgent);
      if (isIosSafari) {
        window.setTimeout(() => {
          show('공유 버튼을 눌러 “홈 화면에 추가”하면 주소창 없이 전체화면으로 플레이할 수 있어요.', false);
        }, 4000);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
